spring.application.name=knowledge-assistant
server.port=8080
# optional .env file in the project root (KEY=value lines)
spring.config.import=optional:file:./.env[.properties]

app.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.llm-model=${LLM_MODEL:claude-sonnet-5-5}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.data-dir=${DATA_DIR:./data}
app.seed-demo=false

# H2 file database (swap for MySQL by changing url/driver/username/password; schema.sql is plain SQL)
spring.datasource.url=jdbc:h2:file:${app.data-dir}/app
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB
spring.mvc.static-path-pattern=/static/**
